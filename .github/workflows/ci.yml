name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: mvn clean package -DskipTests

      - name: 构建 Docker 镜像
        run: docker build -t ghcr.io/wwx6005608/deno1:latest .

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: wwx6005608
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像到 GHCR
        run: docker push ghcr.io/wwx6005608/deno1:latest
